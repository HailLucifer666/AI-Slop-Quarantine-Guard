services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:password@postgres:5432/app
      REDIS_URL: redis://redis:6379
      GITHUB_WEBHOOK_SECRET: dev_secret
      GITHUB_APP_ID: dev_app_id
      GITHUB_APP_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA0Z3VS5JJcds9s00...\n-----END RSA PRIVATE KEY-----"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../api:/app

  worker:
    build:
      context: ../api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://app:password@postgres:5432/app
      REDIS_URL: redis://redis:6379
      GITHUB_WEBHOOK_SECRET: dev_secret
      GITHUB_APP_ID: dev_app_id
      GITHUB_APP_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA0Z3VS5JJcds9s00...\n-----END RSA PRIVATE KEY-----"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../api:/app

  web:
    build:
      context: ../web
      args:
        # Baked into the client bundle at build time. The browser runs on the
        # host, so it reaches the API via the host-mapped port, not the compose
        # service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
