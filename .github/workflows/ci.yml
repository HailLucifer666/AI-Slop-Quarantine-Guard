name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.15.20
      - run: ruff check api/

  # Informational only (continue-on-error): the codebase has ~40 pre-existing
  # SQLAlchemy-related type errors (Column[T] vs T, sessionmaker overloads —
  # the well-known friction of using mypy against SQLAlchemy models without the
  # dedicated plugin) that would need a real typing cleanup pass to resolve.
  # This job surfaces NEW errors for visibility without blocking merges on the
  # pre-existing baseline; promote to blocking once that baseline is clean.
  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The SQLAlchemy mypy plugin lives in 2.0.x; SQLAlchemy 2.1 removed
      # sqlalchemy.ext.mypy. This job only type-checks — pin 2.0.51 so the
      # plugin (and [tool.mypy]) load. Runtime/test jobs keep latest SA.
      - run: pip install -e api[dev] "sqlalchemy==2.0.51" mypy==1.19.1
      # Run from api/ so mypy finds [tool.mypy] in api/pyproject.toml
      # (config discovery walks up from the CWD, not down from the repo root).
      - run: cd api && mypy app

  test:
    runs-on: ubuntu-latest
    env:
      # Fail-closed config defaults to production; the suite needs the dev
      # defaults (no webhook secret / API key) to even import.
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e api[dev] pytest-cov==7.1.0
      - run: cd api && pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: api/coverage.xml
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history; a shallow clone would miss it
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required if this repo ever moves under a GitHub organization
          # account (free at gitleaks.io) — unused/harmless for a personal repo.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, web, security]
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
