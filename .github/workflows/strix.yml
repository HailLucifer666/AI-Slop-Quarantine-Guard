name: Strix AI Pentest (advisory)

# Independent of the Guard's deterministic Check-Run gate (see ci.yml / api/app).
# Strix is an LLM-driven autonomous pentest agent — its findings are NOT reproducible
# facts and must never feed api/app/analyzers or checks.py. This job is advisory-only
# and never blocks the PR (continue-on-error).

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

# Cancel a superseded run for the same PR — new pushes shouldn't pile up
# concurrent LLM-driven scans burning the operator's API budget.
concurrency:
  group: strix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Fork PRs don't have repo secrets — skip cleanly instead of running a
    # command guaranteed to fail on missing credentials.
    if: ${{ github.event_name == 'workflow_dispatch' || secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache pipx-installed Strix
        uses: actions/cache@v6
        with:
          path: ~/.local/pipx/venvs/strix-agent
          key: strix-agent-1.0.4-${{ runner.os }}

      - name: Install Strix
        run: pipx install strix-agent==1.0.4

      - name: Run Strix (non-interactive)
        env:
          STRIX_LLM: ${{ vars.STRIX_LLM || 'openai/minimaxai/minimax-m3' }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n --target . --output strix_runs

      - name: Upload findings
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: strix-findings
          path: strix_runs/
          retention-days: 14

      # Strix's own output schema isn't documented (no fixed JSON/SARIF format to
      # parse as of strix-agent 1.0.4) — rather than guess at a structure and risk
      # misreporting what an LLM-driven pentester found, this links to the
      # uploaded artifact instead of fabricating a findings summary in-line.
      - name: Comment with a link to the findings artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### 🤖 Strix AI pentest — advisory, not a Guard fact',
                '',
                'An LLM-driven pentest agent scanned this PR. These are AI-generated ' +
                'hypotheses, not verified facts — they never block this PR and never ' +
                'change the Guard\'s check-run conclusion.',
                '',
                `Findings (if any) are attached as a workflow artifact: [view run](${runUrl}).`,
              ].join('\n'),
            });
